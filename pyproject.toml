[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metricledger"
version = "0.1.0"
description = "Trusted semantic ChatBI and bounded metric investigation agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "sqlglot>=26,<27",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metricledger = ["resources/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

