name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Test backend
        run: python -m pytest -q --cov=metricledger --cov-report=term
      - name: Run evaluation
        run: python scripts/run_eval.py
      - name: Enforce scenario count and safety gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("eval/results.json").read_text(encoding="utf-8"))
          count = report["scenario_count"]
          assert count >= 72, count
          metrics = report["baselines"]["metricledger"]
          assert metrics["scenario_success_count"] == count, metrics["scenario_success_count"]
          assert metrics["unsafe_answer_count"] == 0, metrics["unsafe_answer_count"]
          assert metrics["scope_violation_count"] == 0, metrics["scope_violation_count"]
          assert metrics["zero_as_empty_count"] == 0, metrics["zero_as_empty_count"]
          assert metrics["unsupported_claim_count"] == 0, metrics["unsupported_claim_count"]
          assert metrics["evidence_violation_count"] == 0, metrics["evidence_violation_count"]
          assert metrics["budget_violation_count"] == 0, metrics["budget_violation_count"]
          print(f"scenario and safety gates passed: {count}")
          PY
      - name: Run in-process CLI
        run: python scripts/ask.py --json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend
        run: npm --prefix web ci
      - name: Test frontend
        run: npm --prefix web test -- --run
      - name: Build frontend
        run: npm --prefix web run build
      - name: Audit dependencies
        run: npm --prefix web audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag metricledger:ci .
      - name: Start production image
        run: |
          set -euo pipefail
          docker run --detach \
            --name metricledger-ci \
            --publish 18000:8000 \
            --env METRICLEDGER_RATE_LIMIT_PER_MINUTE=120 \
            metricledger:ci
          for attempt in {1..60}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18000/api/health >/dev/null; then
              echo "container health endpoint is ready"
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy" >&2
          exit 1
      - name: Verify non-root runtime
        run: |
          user="$(docker inspect --format '{{.Config.User}}' metricledger-ci)"
          test -n "$user"
          test "$user" != "root"
          test "$user" != "0"
          echo "container runs as: $user"
      - name: Set up Python for smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute container smoke assertions
        run: python scripts/container_smoke.py --base-url http://127.0.0.1:18000
      - name: Show container logs on failure
        if: failure()
        run: docker logs metricledger-ci
      - name: Remove container
        if: always()
        run: docker rm --force metricledger-ci

  config:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate deployment YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in (
              "compose.yaml",
              "deploy/prometheus/prometheus.yml",
              "deploy/prometheus/alerts.yml",
              ".github/workflows/ci.yml",
          ):
              yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              print(f"{name}: YAML OK")
          PY
