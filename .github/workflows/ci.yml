name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Test backend
        run: python -m pytest -q --cov=metricledger --cov-report=term
      - name: Run evaluation
        run: python scripts/run_eval.py
      - name: Enforce scenario count and safety gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("eval/results.json").read_text(encoding="utf-8"))
          assert report["scenario_count"] == 63, report["scenario_count"]
          metrics = report["baselines"]["metricledger"]
          assert metrics["scenario_success_count"] == 63, metrics["scenario_success_count"]
          assert metrics["unsafe_answer_count"] == 0, metrics["unsafe_answer_count"]
          assert metrics["scope_violation_count"] == 0, metrics["scope_violation_count"]
          assert metrics["zero_as_empty_count"] == 0, metrics["zero_as_empty_count"]
          assert metrics["unsupported_claim_count"] == 0, metrics["unsupported_claim_count"]
          assert metrics["evidence_violation_count"] == 0, metrics["evidence_violation_count"]
          print("scenario and safety gates passed")
          PY
      - name: Run in-process CLI
        run: python scripts/ask.py --json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend
        run: npm --prefix web ci
      - name: Test frontend
        run: npm --prefix web test -- --run
      - name: Build frontend
        run: npm --prefix web run build
      - name: Audit dependencies
        run: npm --prefix web audit --audit-level=high

  config:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install pyyaml
      - name: Validate deployment YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in (
              "compose.yaml",
              "deploy/prometheus/prometheus.yml",
              "deploy/prometheus/alerts.yml",
              ".github/workflows/ci.yml",
          ):
              yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              print(f"{name}: YAML OK")
          PY
